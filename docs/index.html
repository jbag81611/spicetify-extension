<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spicetify 확장 업데이트</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0b; color: #fff;
         font-family: "Pretendard", "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
  .card { width: min(440px, calc(100vw - 32px)); background: #121212; border: 1px solid rgba(255,255,255,.1);
          border-radius: 16px; padding: 24px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 0 0 14px; color: #b3b3b3; font-size: 14px; line-height: 1.55; }
  button { border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer;
           background: #3d91f4; color: #fff; }
  .ghost { background: rgba(255,255,255,.1); }
  details { margin-top: 18px; color: #b3b3b3; font-size: 13px; }
  code { display: block; margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: #000; color: #e6e6e6;
         font-size: 12px; word-break: break-all; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="card">
  <h1>PowerShell 업데이트를 여는 중…</h1>
  <p>브라우저가 <b>jihoon-updater 열기</b>를 물어보면 <b>열기</b>를 눌러주세요.<br>
     "항상 허용"에 체크하면 다음부터는 묻지 않아요. 업데이트가 끝나면 이 창은 닫아도 돼요.</p>
  <div class="row">
    <button id="open" type="button">다시 열기</button>
    <button id="close" class="ghost" type="button">창 닫기</button>
  </div>
  <details>
    <summary>아무 일도 안 일어나면 (처음 한 번 설치)</summary>
    <p style="margin-top:10px">PowerShell에 아래 명령어를 붙여넣고 Enter를 누르세요.</p>
    <code id="cmd"></code>
    <button id="copy" class="ghost" type="button">명령어 복사</button>
  </details>
</main>
<script>
  const OWNER = "jbag81611", REPO = "spicetify-extension";
  const only = new URLSearchParams(location.search).get("only") || "";
  const safe = only.split(",").filter((f) => /^[A-Za-z0-9._-]+\.m?js$/.test(f)).join(",");
  const target = "jihoon-updater://update" + (safe ? "?only=" + encodeURIComponent(safe) : "");
  const cmd = `iwr -useb https://raw.githubusercontent.com/${OWNER}/${REPO}/main/installer/install.ps1 | iex`;
  document.getElementById("cmd").textContent = cmd;
  const go = () => { location.href = target; };
  document.getElementById("open").onclick = go;
  document.getElementById("close").onclick = () => window.close();
  document.getElementById("copy").onclick = async (e) => {
    try { await navigator.clipboard.writeText(cmd); e.target.textContent = "복사됨"; } catch (err) { /* 무시 */ }
  };
  setTimeout(go, 300);
</script>
</body>
</html>
